<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinth Studio</title>
<meta name="description" content="Kinth Studio — indie developer building thoughtful software.">
<link rel="icon" type="image/png" href="assets/app-icon-blue.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #1e1e24; --bg-bottom: #121218;
    --surface: #21212a; --surface-strong: #282833;
    --stroke: rgba(255,255,255,0.08);
    --ink: #ffffff; --muted: #9d9fab;
    --blue: #4f88e7; --blue-light: #8cbbff; --green: #22c55e; --orange: #ff8a00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.55;
  }
  a { color: var(--blue-light); text-decoration: none; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  header.hero { padding: 84px 0 56px; text-align: center; }
  .logo-mark { width: 76px; height: 76px; border-radius: 18px; margin-bottom: 24px; box-shadow: 0 14px 34px rgba(79,136,231,0.25); }
  .word-mark { font-size: 34px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 10px; }
  .word-mark span { font-weight: 400; color: var(--muted); }
  .subtitle { font-size: 16px; font-weight: 300; color: var(--muted); margin: 0; }

  section { padding: 8px 0 64px; }
  .section-eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--blue-light); margin-bottom: 16px;
  }

  .app-card {
    display: flex; align-items: center; gap: 20px;
    background: var(--surface); border: 1px solid var(--stroke);
    border-radius: 20px; padding: 22px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .app-card:hover { border-color: rgba(79,136,231,0.4); background: var(--surface-strong); text-decoration: none; }
  .app-card img { width: 64px; height: 64px; border-radius: 15px; flex-shrink: 0; }
  .app-card .info { flex: 1; min-width: 0; }
  .app-card h3 { font-size: 17px; font-weight: 600; margin: 0 0 4px; color: var(--ink); }
  .app-card p { font-size: 14px; font-weight: 300; color: var(--muted); margin: 0; }
  .app-card .arrow { color: var(--muted); font-size: 20px; flex-shrink: 0; }

  .more-soon {
    margin-top: 14px; padding: 22px; text-align: center;
    border: 1px dashed var(--stroke); border-radius: 20px;
    color: var(--muted); font-size: 14px; font-weight: 300;
  }

  footer {
    border-top: 1px solid var(--stroke);
    padding: 28px 0 48px;
    color: var(--muted); font-size: 13px; font-weight: 300;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  footer a { color: var(--muted); }

  @media (max-width: 480px) {
    header.hero { padding: 64px 0 40px; }
    .word-mark { font-size: 28px; }
    .app-card { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <img class="logo-mark" src="assets/app-icon-blue.png" alt="Kinth Studio">
    <h1 class="word-mark">kinth<span>studio</span></h1>
    <p class="subtitle">Indie developer. Apps, games, and tools.</p>
  </header>

  <section>
    <div class="section-eyebrow">Apps</div>

    <a class="app-card" href="courttracker/">
      <img src="assets/courttracker-icon.png" alt="Court Tracker app icon">
      <div class="info">
        <h3>Court Tracker</h3>
        <p>Confident basketball game tracking for coaches and scorekeepers — offline, fast, free to start.</p>
      </div>
      <div class="arrow">&rarr;</div>
    </a>

    <div class="more-soon">More apps on the way.</div>
  </section>

  <footer>
    <div>&copy; <span id="year"></span> Kinth Studio</div>
    <a href="mailto:kinthstudio@icloud.com">Contact</a>
  </footer>
</div>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
